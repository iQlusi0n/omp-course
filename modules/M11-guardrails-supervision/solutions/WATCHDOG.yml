# Advisor roster for omp-course-lab (project-level: <repo>/WATCHDOG.yml or <repo>/.omp/WATCHDOG.yml)
# Shared guidance for every advisor also comes from WATCHDOG.md.

instructions: |
  You are reviewing a small Python stdlib project (http.server API, argparse CLI, SQLite).
  Prefer one precise note over three vague ones. Quote the file and line you are worried about.

maxNotesPerUpdate: 3

advisors:
  - name: ErrorHandling
    enabled: true
    # model omitted → falls back to modelRoles.advisor
    tools: [read, grep, glob]
    instructions: |
      Your only job is exception handling. Flag any new `except` branch that swallows,
      logs-and-continues, or returns a default without the caller being able to tell.
      Raise `blocker` when a failure the caller depends on becomes invisible.

  - name: ApiContract
    enabled: true
    tools: [read, grep]
    instructions: |
      Watch `api/` request handlers. Every error path must return the status the error
      deserves — 400 for bad input, 404 for a missing row, 409 for a duplicate, 500 for
      anything unexpected — with a JSON body carrying an `error` field. Raise `concern` for a
      2xx-on-failure or for a catch-all that maps every exception to 400.

  - name: Fixer
    enabled: false
    # Deliberately paused. Enable only when you trust the advisor model to run code:
    # these tools mutate the workspace and still go through your approval mode.
    tools: [read, grep, glob, bash]
    instructions: |
      You may run `python3 -m unittest discover -s tests` (or `LAB_ISSUE=8 python3 -m unittest
      tests.test_issues`) to prove or disprove a suspicion before advising.
