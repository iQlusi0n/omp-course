# omp-course-lab/.omp/secrets.yml — project secret entries.
# Requires secrets.enabled: true. Merged with ~/.omp/agent/secrets.yml;
# a project entry overrides a global entry with identical `content`.
# Top level MUST be a YAML array.

# The lab's fake API token: labtok_ + 16 lowercase hex chars (see .env.example, LAB_TOKEN=labtok_0123456789abcdef).
# Reversible: the model sees $$LABTOKEN_<hash>:L$$; the real value is restored in tool arguments before execution.
- type: regex
  content: "labtok_[0-9a-f]{16}"
  friendlyName: Lab Token

# One-way example: hide connection-string credentials entirely (not restored).
- type: regex
  content: "postgres://[^\\s]+"
  mode: replace
  replacement: "postgres://***"
